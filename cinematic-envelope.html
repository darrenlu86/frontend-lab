<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Cinematic Envelope — 粉色信封翻蓋</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Noto+Serif+TC:wght@300;400&family=Allura&family=Italianno&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  /* === 影片實測色彩 === */
  :root {
    --paper-bg: #ecd6d0;
    --paper-base: 228, 204, 198;   /* 信封底層 — dusty pink (略暖) */
    --flap-base:  232, 210, 204;   /* 蓋子 — 略亮一點 */
    --wax-light:  #d8b8ad;
    --wax-mid:    #c89e91;
    --wax-dark:   #a07a6a;
    --text-soft:  rgba(110, 70, 55, 0.78);
  }

  html, body {
    width: 100%;
    height: 100dvh;
    overflow: hidden;
    background: var(--paper-bg);
    font-family: 'Cormorant Garamond', 'Noto Serif TC', serif;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  .scene {
    position: relative;
    width: 100vw;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }

  /* === 信封外殼（處理 drop-shadow） === */
  .envelope-outer {
    position: absolute;
    inset: 0;
    transition: transform 0.7s cubic-bezier(0.4,0,0.2,1),
                opacity 0.5s ease,
                filter 0.5s ease;
  }

  /* === 信封 — 3D 容器 === */
  .envelope {
    position: relative;
    width: 100%; height: 100%;
    perspective: 1400px;
    transform-style: preserve-3d;
  }

  /* === 信封底層 === */
  .env-body {
    width: 100%; height: 100%;
    position: relative;
    background-color: rgb(228, 204, 198);
    overflow: hidden;
    box-shadow:
      inset 0 0 60px rgba(120, 80, 70, 0.06),
      inset 0 2px 1px rgba(255,240,232,0.10),
      inset 0 -2px 4px rgba(80, 50, 40, 0.10);
  }
  .env-body canvas {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
  }
  /* 紙張紋理層次 — 強化上下漸層 + 中央 V 處微暗 */
  .env-body::after {
    content: '';
    position: absolute; inset: 0;
    background:
      linear-gradient(to bottom,
        rgba(255,250,245,0.06) 0%,
        rgba(255,250,245,0.03) 30%,
        transparent 42%,
        rgba(60,30,25,0.025) 46%,
        rgba(60,30,25,0.045) 100%),
      linear-gradient(to right,
        rgba(80,40,30,0.020) 0%,
        transparent 22%,
        transparent 78%,
        rgba(80,40,30,0.018) 100%),
      radial-gradient(ellipse at 50% 42%,
        rgba(80,40,30,0.05) 0%,
        transparent 25%);
    z-index: 1; pointer-events: none;
  }

  /* === 蓋子 V 形陰影 SVG（光源左上） === */
  .flap-shadow {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    z-index: 2;
  }

  /* === V 摺痕 SVG === */
  .fold-svg {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    z-index: 3;
  }

  /* === 蓋子 wrapper（3D 旋轉容器） === */
  .env-flap-wrapper {
    position: absolute; inset: 0;
    transform-origin: center top;
    transform-style: preserve-3d;
    z-index: 4;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
  }
  .env-flap {
    position: absolute; inset: 0;
    background-color: rgb(232, 210, 204);
    clip-path: polygon(0% 0%, 100% 0%, 100% 32%, 50% 48%, 0% 32%);
    overflow: hidden;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
  }
  .env-flap canvas {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
  }
  /* 蓋子明暗 — 光源左上 */
  .env-flap::before {
    content: '';
    position: absolute; inset: 0;
    background:
      linear-gradient(135deg,
        rgba(255,255,255,0.08) 0%,
        transparent 40%,
        rgba(0,0,0,0.035) 70%,
        rgba(0,0,0,0.07) 100%),
      linear-gradient(to bottom,
        transparent 0%,
        rgba(0,0,0,0.025) 38%,
        rgba(0,0,0,0.045) 42%);
    pointer-events: none; z-index: 1;
    transition: background 0.8s ease;
  }
  .scene.opening .env-flap::before {
    background:
      linear-gradient(135deg,
        rgba(255,255,255,0.04) 0%,
        rgba(0,0,0,0.05) 30%,
        rgba(0,0,0,0.14) 70%,
        rgba(0,0,0,0.20) 100%),
      linear-gradient(to bottom,
        transparent 0%,
        rgba(0,0,0,0.04) 38%,
        rgba(0,0,0,0.08) 42%);
  }

  /* === 蠟封 — 在 wrapper 內，跟著 3D 旋轉 === */
  .seal {
    position: absolute;
    top: 48%; left: 50%;
    transform: translate(-50%, -50%);
    width: clamp(94px, 24vmin, 138px);
    height: clamp(94px, 24vmin, 138px);
    /* 微微不規則邊緣 — 模擬自然蠟滴形 */
    border-radius: 49% 51% 48% 52% / 50% 49% 51% 50%;
    overflow: hidden;
    cursor: pointer;
    transition: opacity 0.6s ease 0.3s;
    z-index: 10;
  }
  .seal-disc {
    border-radius: 49% 51% 48% 52% / 50% 49% 51% 50% !important;
  }
  .seal-disc canvas {
    border-radius: 49% 51% 48% 52% / 50% 49% 51% 50% !important;
  }
  .seal::before {
    border-radius: 49% 51% 48% 52% / 50% 49% 51% 50% !important;
  }
  .seal::before {
    /* 較輕的接觸陰影 — 讓蠟封「貼著紙面」而非「飄浮」 */
    content: '';
    position: absolute; inset: 0; border-radius: 50%;
    box-shadow:
      0 1px 1px rgba(80,40,30,0.14),
      1px 2px 2px rgba(80,40,30,0.10),
      2px 3px 5px rgba(80,40,30,0.10),
      2px 4px 9px rgba(80,40,30,0.06);
    pointer-events: none;
  }
  .scene.opening .seal-pulse { animation: none; opacity: 0; }

  .seal-disc {
    width: 100%; height: 100%; border-radius: 50%;
    position: relative; overflow: hidden;
  }
  .seal-disc canvas {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    border-radius: 50%;
  }
  /* 蠟封內側陰影（柔化中央） */
  .seal-shadow {
    position: absolute; inset: 4px; border-radius: 50%;
    box-shadow:
      inset 3px 3px 5px -2px rgba(80,40,30,0.20),
      inset 2px 2px 3px -1px rgba(80,40,30,0.12);
    pointer-events: none; z-index: 3;
  }
  /* 移除 seal-ring 凸環 — 自然蠟印沒有金屬印章感的環 */
  .seal-ring { display: none; }
  /* 蠟封字 M&J — debossed 凹陷壓印效果（光源左上）
     凹陷字的視覺邏輯：
       - 凹槽左上邊：光被擋住 → 暗
       - 凹槽右下邊：光照到內壁 → 亮
       - 字本色：比蠟封基色稍深（陰影裡的暗部） */
  .seal-text {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Italianno', 'Allura', cursive;
    font-size: clamp(30px, 7.5vmin, 44px);
    color: rgba(85,55,42,0.62);
    line-height: 1;
    letter-spacing: 1px;
    text-shadow:
      /* 左上凹陷外緣陰影 */
      -1px -1px 0 rgba(60,30,18,0.55),
      -1px -1px 2px rgba(60,30,18,0.32),
      -0.5px -0.5px 0.5px rgba(60,30,18,0.40),
      /* 右下凹陷內壁高光（弱，避免看起來凸起） */
       0.8px  0.8px 0 rgba(255,240,225,0.45),
       1px  1.5px 1.5px rgba(255,240,225,0.25);
    z-index: 5;
  }
  .seal-pulse {
    position: absolute; inset: -8px; border-radius: 50%;
    border: 1px solid rgba(180,140,120,0.32);
    animation: pulse 2.5s ease-in-out infinite;
    pointer-events: none;
  }
  @keyframes pulse {
    0%, 100% { transform: scale(1); opacity: 0.35; }
    50%      { transform: scale(1.14); opacity: 0; }
  }

  /* === 副標題 === */
  .env-text {
    position: fixed;
    top: 65%; left: 0; right: 0;
    text-align: center;
    color: var(--text-soft);
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-weight: 400;
    font-size: clamp(16px, 4.4vmin, 24px);
    letter-spacing: 0.4px;
    line-height: 1.5;
    z-index: 6;
    transition: opacity 0.45s ease;
  }

  /* === 後場（信封消失後保留的柔粉底）— 純色避免中央亮圈殘影 === */
  .after-stage {
    position: absolute; inset: 0;
    background: #ead4ce;
    opacity: 0;
    z-index: 0;
    transition: opacity 0.8s ease 0.6s;
  }
  .scene.opening .after-stage { opacity: 1; }

  /* ====================== 翻蓋動畫（v14 單階段同步）======================
     翻蓋 + 淡化 + 上移 同時進行，由單一 .opening class 觸發
     ===================================================================== */

  .scene.opening .fold-upper { opacity: 0; }

  .scene.opening .env-flap-wrapper {
    transform: rotateX(88deg);
    opacity: 0;
    transition: transform 0.95s cubic-bezier(0.34, 1.08, 0.64, 1),
                opacity 0.85s ease 0.15s;
  }

  .scene.opening .envelope-outer {
    transform: scale(1.035);
    opacity: 0;
    filter: brightness(1.04);
    transition: transform 1.0s cubic-bezier(0.5, 0, 0.3, 1),
                opacity 0.9s ease 0.1s,
                filter 0.8s ease;
  }

  .scene.opening .flap-shadow { opacity: 0; transition: opacity 0.4s ease; }
  /* 蠟封不再獨立 fade — 它隨 .env-flap-wrapper 一起翻起+淡出，視覺上「被蓋子帶走」 */
  .scene.opening .env-text { opacity: 0; transition: opacity 0.4s ease; }

  /* === 重播按鈕（動畫完成才出現） === */
  .reset-btn {
    position: fixed;
    bottom: 24px; right: 24px;
    background: rgba(120, 80, 65, 0.45);
    color: #fff5ee;
    border: 1px solid rgba(255, 255, 255, 0.18);
    padding: 8px 16px;
    border-radius: 22px;
    font-size: 12px;
    font-family: inherit;
    letter-spacing: 1px;
    cursor: pointer;
    z-index: 100;
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.5s ease 1.6s;
  }
  .scene.opening .reset-btn {
    opacity: 0.5;
    pointer-events: auto;
  }
  .reset-btn:hover { opacity: 1; }

  /* === 測試 freeze hook === */
  .scene.frozen * {
    animation-play-state: paused !important;
    transition: none !important;
  }
</style>
</head>
<body>

<div class="scene" id="scene">
  <!-- 信封消失後的粉色底 -->
  <div class="after-stage"></div>

  <!-- 信封外殼 -->
  <div class="envelope-outer">
    <div class="envelope">
      <!-- 信封底層 -->
      <div class="env-body">
        <canvas id="envTex"></canvas>
      </div>

      <!-- 蓋子 V 形陰影 -->
      <svg class="flap-shadow" viewBox="0 0 100 100" preserveAspectRatio="none">
        <defs>
          <filter id="flapShadowBlur">
            <feGaussianBlur stdDeviation="2.2"/>
          </filter>
          <linearGradient id="flapShadowGrad" x1="0" y1="0" x2="1" y2="0.3">
            <stop offset="0%"   stop-color="rgba(0,0,0,0.0)"/>
            <stop offset="25%"  stop-color="rgba(0,0,0,0.06)"/>
            <stop offset="50%"  stop-color="rgba(0,0,0,0.20)"/>
            <stop offset="75%"  stop-color="rgba(0,0,0,0.42)"/>
            <stop offset="100%" stop-color="rgba(0,0,0,0.54)"/>
          </linearGradient>
        </defs>
        <polygon points="0,0 100,0 100,32 50,48 0,32"
                 fill="url(#flapShadowGrad)" filter="url(#flapShadowBlur)"/>
      </svg>

      <!-- V 摺痕 -->
      <svg class="fold-svg" viewBox="0 0 100 100" preserveAspectRatio="none">
        <defs>
          <filter id="foldBlur"><feGaussianBlur stdDeviation="0.15"/></filter>
          <filter id="foldShadow"><feGaussianBlur stdDeviation="0.4"/></filter>
        </defs>
        <g class="fold-upper" style="transition: opacity 0.5s ease;">
          <line x1="-30" y1="20" x2="50" y2="48"
                stroke="rgba(60,30,20,0.14)" stroke-width="2.0" filter="url(#foldShadow)"/>
          <line x1="130" y1="20" x2="50" y2="48"
                stroke="rgba(60,30,20,0.12)" stroke-width="1.6" filter="url(#foldShadow)"/>
          <line x1="-30" y1="20" x2="50" y2="48"
                stroke="rgba(60,30,20,0.24)" stroke-width="0.55" filter="url(#foldBlur)"/>
          <line x1="130" y1="20" x2="50" y2="48"
                stroke="rgba(60,30,20,0.22)" stroke-width="0.5" filter="url(#foldBlur)"/>
          <line x1="-30" y1="19.5" x2="50.2" y2="47.5"
                stroke="rgba(255,240,225,0.18)" stroke-width="0.35"/>
          <line x1="130" y1="19.5" x2="49.8" y2="47.5"
                stroke="rgba(255,240,225,0.15)" stroke-width="0.3"/>
        </g>
        <g class="fold-lower">
          <line x1="-30" y1="80" x2="50" y2="48"
                stroke="rgba(60,30,20,0.09)" stroke-width="1.1" filter="url(#foldShadow)"/>
          <line x1="130" y1="80" x2="50" y2="48"
                stroke="rgba(60,30,20,0.08)" stroke-width="0.95" filter="url(#foldShadow)"/>
          <line x1="-30" y1="80" x2="50" y2="48"
                stroke="rgba(60,30,20,0.12)" stroke-width="0.32" filter="url(#foldBlur)"/>
          <line x1="130" y1="80" x2="50" y2="48"
                stroke="rgba(60,30,20,0.11)" stroke-width="0.28" filter="url(#foldBlur)"/>
          <line x1="-30" y1="80.4" x2="50.2" y2="48.4"
                stroke="rgba(255,240,225,0.12)" stroke-width="0.25"/>
          <line x1="130" y1="80.4" x2="49.8" y2="48.4"
                stroke="rgba(255,240,225,0.10)" stroke-width="0.22"/>
        </g>
      </svg>

      <!-- 上蓋 wrapper -->
      <div class="env-flap-wrapper">
        <div class="env-flap">
          <canvas id="flapTex"></canvas>
        </div>
        <!-- 蠟封 -->
        <div class="seal" id="seal">
          <div class="seal-pulse"></div>
          <div class="seal-disc">
            <canvas id="sealTex"></canvas>
            <div class="seal-shadow"></div>
            <div class="seal-ring"></div>
            <div class="seal-text">M &amp; J</div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="env-text">Esta invitación es<br>exclusiva para ti</div>

  <button class="reset-btn" id="resetBtn" onclick="resetScene()">↻ 重播</button>
</div>

<script>
  // ========= 粉色紙張紋理 =========
  function makePaperTexture(canvas, w, h, baseR, baseG, baseB) {
    canvas.width = w; canvas.height = h;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = `rgb(${baseR},${baseG},${baseB})`;
    ctx.fillRect(0, 0, w, h);

    const g = ctx.createLinearGradient(0, 0, w * 0.4, h);
    g.addColorStop(0, 'rgba(255,255,255,0.04)');
    g.addColorStop(1, 'rgba(0,0,0,0.025)');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, w, h);

    const img = ctx.getImageData(0, 0, w, h);
    const d = img.data;
    // 噪點
    for (let i = 0; i < d.length; i += 4) {
      const n = (Math.random() - 0.5) * 22;
      d[i] += n; d[i+1] += n; d[i+2] += n;
    }
    // 纖維線
    for (let f = 0; f < 1100; f++) {
      const fx = Math.random() * w, fy = Math.random() * h;
      const len = 8 + Math.random() * 35;
      const br = (Math.random() - 0.5) * 16;
      for (let p = 0; p < len; p++) {
        const px = Math.floor(fx + p + (Math.random() - 0.5) * 2);
        const py = Math.floor(fy + (Math.random() - 0.5) * 1.5);
        if (px >= 0 && px < w && py >= 0 && py < h) {
          const idx = (py * w + px) * 4;
          d[idx] += br; d[idx+1] += br; d[idx+2] += br;
        }
      }
    }
    // 不規則斑塊
    for (let b = 0; b < 45; b++) {
      const bx = Math.random() * w, by = Math.random() * h;
      const bR = 12 + Math.random() * 36;
      const bBr = (Math.random() - 0.5) * 9;
      for (let dy = -bR; dy < bR; dy++) {
        for (let dx = -bR; dx < bR; dx++) {
          const dist = Math.sqrt(dx*dx + dy*dy);
          if (dist < bR) {
            const px = Math.floor(bx + dx), py = Math.floor(by + dy);
            if (px >= 0 && px < w && py >= 0 && py < h) {
              const falloff = 1 - dist / bR;
              const idx = (py * w + px) * 4;
              const v = bBr * falloff * falloff;
              d[idx] += v; d[idx+1] += v; d[idx+2] += v;
            }
          }
        }
      }
    }
    ctx.putImageData(img, 0, 0);
  }

  // ========= 蠟封紋理（裸粉色） =========
  function makeWaxSeal() {
    const c = document.getElementById('sealTex');
    const size = 200;
    c.width = size; c.height = size;
    const ctx = c.getContext('2d');
    const cx = size/2, cy = size/2, r = size/2;

    // 圓頂光照漸層 — 裸粉色蠟
    const base = ctx.createRadialGradient(
      cx - r*0.3, cy - r*0.35, r*0.05,
      cx + r*0.1, cy + r*0.2,  r*1.1
    );
    // 紙質壓花感 — 整體再亮一級，極接近紙色 rgb(228,204,198)
    base.addColorStop(0,    '#e6cabf');  // 受光（幾乎=紙色）
    base.addColorStop(0.35, '#dabbb0');
    base.addColorStop(0.70, '#caa89c');
    base.addColorStop(0.90, '#bd998a');
    base.addColorStop(1,    '#ae8b79');  // 柔和暗邊
    ctx.fillStyle = base;
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI*2);
    ctx.fill();

    // 細微蠟面紋理
    const img = ctx.getImageData(0, 0, size, size);
    const d = img.data;
    for (let i = 0; i < d.length; i += 4) {
      const px = (i/4) % size, py = Math.floor((i/4) / size);
      const dist = Math.sqrt((px-cx)**2 + (py-cy)**2);
      if (dist > r) continue;
      const n = (Math.random() - 0.5) * 8;
      const warm = (Math.random() - 0.5) * 3;
      d[i] += n + warm; d[i+1] += n; d[i+2] += n - warm;
    }
    // 小顆粒
    for (let g = 0; g < 140; g++) {
      const angle = Math.random() * Math.PI * 2;
      const dist = Math.random() * r * 0.85;
      const gx = Math.floor(cx + Math.cos(angle) * dist);
      const gy = Math.floor(cy + Math.sin(angle) * dist);
      if (gx >= 0 && gx < size && gy >= 0 && gy < size) {
        const idx = (gy * size + gx) * 4;
        const v = (Math.random() - 0.5) * 6;
        d[idx] += v; d[idx+1] += v; d[idx+2] += v;
      }
    }
    ctx.putImageData(img, 0, 0);

    // 邊緣暗化（柔和）
    ctx.globalCompositeOperation = 'source-atop';
    const edge = ctx.createRadialGradient(
      cx - r*0.18, cy - r*0.18, r*0.55,
      cx + r*0.05, cy + r*0.05, r
    );
    edge.addColorStop(0, 'transparent');
    edge.addColorStop(0.4, 'rgba(0,0,0,0.018)');
    edge.addColorStop(0.7, 'rgba(0,0,0,0.06)');
    edge.addColorStop(0.88, 'rgba(0,0,0,0.12)');
    edge.addColorStop(1, 'rgba(0,0,0,0.20)');
    ctx.fillStyle = edge;
    ctx.fillRect(0, 0, size, size);

    // 盤面壓暗
    const dish = ctx.createRadialGradient(cx, cy, 0, cx, cy, r*0.72);
    dish.addColorStop(0, 'rgba(0,0,0,0.08)');
    dish.addColorStop(0.7, 'rgba(0,0,0,0.06)');
    dish.addColorStop(1, 'transparent');
    ctx.fillStyle = dish;
    ctx.fillRect(0, 0, size, size);

    // 凸環
    const rimOuter = ctx.createRadialGradient(cx, cy, r*0.74, cx, cy, r*0.86);
    rimOuter.addColorStop(0, 'transparent');
    rimOuter.addColorStop(0.2, 'rgba(255,240,225,0.12)');
    rimOuter.addColorStop(0.4, 'rgba(255,240,225,0.22)');
    rimOuter.addColorStop(0.6, 'rgba(255,240,225,0.22)');
    rimOuter.addColorStop(0.8, 'rgba(255,240,225,0.09)');
    rimOuter.addColorStop(1, 'transparent');
    ctx.fillStyle = rimOuter;
    ctx.fillRect(0, 0, size, size);

    // 凸環內側陰影
    const rimInner = ctx.createRadialGradient(cx, cy, r*0.66, cx, cy, r*0.75);
    rimInner.addColorStop(0, 'transparent');
    rimInner.addColorStop(0.4, 'rgba(0,0,0,0.06)');
    rimInner.addColorStop(0.7, 'rgba(0,0,0,0.10)');
    rimInner.addColorStop(1, 'transparent');
    ctx.fillStyle = rimInner;
    ctx.fillRect(0, 0, size, size);
  }

  // ========= 初始化 =========
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const sw = Math.ceil(window.innerWidth * dpr);
  const sh = Math.ceil(window.innerHeight * dpr);
  makePaperTexture(document.getElementById('envTex'),  sw, sh, 224, 200, 196);
  makePaperTexture(document.getElementById('flapTex'), sw, sh, 230, 207, 202);
  makeWaxSeal();

  // ========= 互動 =========
  const scene = document.getElementById('scene');
  const seal  = document.getElementById('seal');

  function openEnvelope() {
    if (scene.classList.contains('opening')) return;
    scene.classList.add('opening');
  }
  window.openEnvelope = openEnvelope;

  function resetScene() {
    scene.classList.remove('opening');
  }

  seal.addEventListener('click', e => {
    e.stopPropagation();
    openEnvelope();
  });

  // ========= Test hooks =========
  const params = new URLSearchParams(location.search);
  const freezeAt = parseInt(params.get('freeze') || '0', 10);
  const autoOpen = params.has('auto') || freezeAt > 0;

  if (autoOpen) setTimeout(() => openEnvelope(), 80);
  if (freezeAt > 0) {
    setTimeout(() => scene.classList.add('frozen'), 80 + freezeAt);
  }
</script>
</body>
</html>
